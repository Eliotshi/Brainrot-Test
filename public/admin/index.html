<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cerveau Cramé CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
  :root{ --seg-pret:#3987e5; --seg-conv:#d95926; --seg-mot:#199e70; --seg-froid:#c98500; --surface:#10132A }
  body{font-size:15px}
  .adm{padding-block:8px 60px}
  .login{max-width:420px;margin:12vh auto 0;padding:28px;border-radius:var(--r-lg);background:var(--ink2);border:1px solid var(--line)}
  .login h1{font-size:1.5rem}
  .login p{color:var(--muted);margin-top:8px}
  .login .btn{width:100%;margin-top:16px}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .kpi{padding:14px 16px;border-radius:var(--r);background:var(--ink2);border:1px solid var(--line);min-width:0}
  .kpi .k{font-size:.78rem;color:var(--muted)}
  .kpi .v{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:.78rem;color:var(--dim);font-family:var(--f-mono)}
  .row2{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}
  .panel{padding:18px;border-radius:var(--r-lg);background:var(--ink2);border:1px solid var(--line);min-width:0;position:relative}
  .panel h2{font-family:var(--f-body);font-size:1rem;font-weight:700}
  .panel .hint{color:var(--muted);font-size:.84rem;margin-top:4px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.84rem;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:50%}
  #matrix svg{width:100%;height:auto;display:block;margin-top:8px}
  .tip{position:absolute;pointer-events:none;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.84rem;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5;min-width:170px}
  .tip b{display:block}
  .tip .m{color:var(--muted);font-family:var(--f-mono);font-size:.78rem}
  .segbars{display:grid;gap:12px;margin-top:14px}
  .sb{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:.88rem}
  .sb .tr{height:12px;background:var(--ink4);border-radius:6px;overflow:hidden}
  .sb .tr i{display:block;height:100%;border-radius:0 4px 4px 0}
  .sb .n{text-align:right;font-family:var(--f-mono)}
  .funnel{display:grid;gap:8px;margin-top:18px}
  .fn{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:.86rem}
  .fn .tr{height:10px;background:var(--ink4);border-radius:5px;overflow:hidden}
  .fn .tr i{display:block;height:100%;background:var(--muted);border-radius:0 4px 4px 0}
  .fn .n{text-align:right;font-family:var(--f-mono)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;align-items:center}
  .filters input,.filters select{background:var(--ink2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;font-size:.88rem}
  .filters input{flex:1;min-width:200px}
  .filters label{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:.86rem}
  .tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:var(--r)}
  table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:1080px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--ink3);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
  th[aria-sort="ascending"]::after{content:" ↑"} th[aria-sort="descending"]::after{content:" ↓"}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--ink2)}
  td.num{font-family:var(--f-mono);text-align:right}
  .segpill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem}
  .segpill i{width:8px;height:8px;border-radius:50%}
  .meter{display:inline-block;width:46px;height:6px;background:var(--ink4);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--muted)}
  select.st{background:var(--ink3);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:4px 6px;font:inherit;font-size:.82rem}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--ink2);border-left:1px solid var(--line);z-index:50;overflow-y:auto;padding:22px;box-shadow:-30px 0 60px rgba(0,0,0,.5)}
  .drawer h2{font-size:1.3rem}
  .dl{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin-top:16px;font-size:.9rem}
  .dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;word-break:break-word}
  .drawer textarea{width:100%;min-height:140px;background:var(--ink);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px;font:inherit;margin-top:6px}
  .incent{margin-top:16px;padding:14px;border-radius:12px;background:var(--ink3);border:1px solid var(--line)}
  .incent b{display:block;color:var(--t5)} .incent span{color:var(--muted);font-size:.88rem}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .err{color:#FF8A8A;font-size:.86rem;margin-top:8px;min-height:1.2em}
  @media (max-width:1000px){ .kpis{grid-template-columns:repeat(3,1fr)} .row2{grid-template-columns:1fr} }
  @media (max-width:560px){ .kpis{grid-template-columns:repeat(2,1fr)} .sb{grid-template-columns:110px 1fr 34px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg></span>Cerveau Cramé · CRM</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" id="btn-refresh" style="padding:.55em 1em;font-size:.86rem" hidden>Actualiser</button>
      <button class="btn btn-ghost" id="btn-csv" style="padding:.55em 1em;font-size:.86rem" hidden>Exporter CSV</button>
      <button class="btn btn-ghost" id="btn-logout" style="padding:.55em 1em;font-size:.86rem" hidden>Se déconnecter</button>
    </div>
  </header>

  <form class="login" id="login">
    <h1>Accès CRM</h1>
    <p>Entre le mot de passe défini dans la variable ADMIN_PASSWORD sur Vercel.</p>
    <div class="field"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="err" id="login-err"></p>
    <button class="btn btn-hot" type="submit">Ouvrir le CRM</button>
  </form>

  <main class="adm" id="app" hidden>
    <section class="kpis" id="kpis"></section>
    <section class="row2">
      <div class="panel">
        <h2>Matrice pouvoir d'achat × motivation</h2>
        <p class="hint">Chaque point est un lead. Survole pour le détail, clique pour ouvrir la fiche.</p>
        <div class="legend" id="legend"></div>
        <div id="matrix"></div>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="panel">
        <h2>Leads par segment</h2>
        <div class="segbars" id="segbars"></div>
        <h2 style="margin-top:26px">Entonnoir</h2>
        <div class="funnel" id="funnel"></div>
      </div>
    </section>
    <section class="filters" aria-label="Filtres">
      <input id="q" type="search" placeholder="Rechercher un prénom ou un e-mail">
      <select id="f-seg" aria-label="Segment"><option value="">Tous les segments</option></select>
      <select id="f-status" aria-label="Statut"><option value="">Tous les statuts</option></select>
      <select id="f-profile" aria-label="Profil"><option value="">Tous les profils</option><option value="etu">Étudiant·e / jeune actif·ve</option><option value="pro">Pro</option></select>
      <select id="f-inc" aria-label="Incentive"><option value="">Tous les incentives</option></select>
      <label><input type="checkbox" id="f-optin"> Opt-in marketing seulement</label>
      <span class="chip mono" id="count"></span>
    </section>
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  </main>
</div>
<aside class="drawer" id="drawer" hidden></aside>
<script src="/assets/content.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
